[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned toolchain. solc is pre-provisioned under ~/.svm/0.8.28 (the default svm
# download host is unreachable in this environment; see contracts/README.md).
# `offline` stops forge from probing the blocked binaries.soliditylang.org host.
solc_version = "0.8.28"
offline = true
evm_version = "cancun"          # Gnosis Chain supports Cancun opcodes

optimizer = true
optimizer_runs = 200
# `via_ir` is a choice here, not a necessity. It was once load-bearing — an earlier
# `Moderation` was 25,986 B through the legacy pipeline and could not be deployed
# at all — but the contract that replaced it is 13,451 B legacy and 11,400 B
# through IR, so both clear EIP-170's 24,576 B with room. It stays on because we
# test what we ship, and on a contract custodying stake running the suite against
# different bytecode than the deployed artifact is not a tradeoff worth taking.
# The mutation harness is the one deliberate exception (see contracts/README.md).
via_ir = true

# Differential vectors are read from disk (M2-8, D10).
# Differential vectors are read from disk (M2-8, D10), and M2.13 §5 WRITES the
# draw vectors the Python differential consumes.
fs_permissions = [{ access = "read-write", path = "./test/vectors" }]

# Integer-only accounting contract: no unchecked surprises we didn't write.
# Deterministic test RNG so distribution/statistical tests are reproducible.
[fuzz]
runs = 256
seed = "0x4d32"                 # fixed seed: differential + distribution tests must be reproducible

[invariant]
runs = 256
depth = 64
fail_on_revert = false          # handler guards revert on out-of-domain calls by design

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 512, depth = 128 }



# Remappings: forge auto-detects lib/, but pin them explicitly for clarity.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]
