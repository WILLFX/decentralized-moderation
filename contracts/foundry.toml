[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned toolchain. solc is pre-provisioned under ~/.svm/0.8.28 (the default svm
# download host is unreachable in this environment; see contracts/README.md).
# `offline` stops forge from probing the blocked binaries.soliditylang.org host.
solc_version = "0.8.28"
offline = true
evm_version = "cancun"          # Gnosis Chain supports Cancun opcodes

optimizer = true
optimizer_runs = 200
via_ir = false                  # see [profile.viair] — this is a DEPLOYMENT decision, not a taste one

# Differential vectors are read from disk (M2-8, D10).
fs_permissions = [{ access = "read", path = "./test/vectors" }]

# Integer-only accounting contract: no unchecked surprises we didn't write.
# Deterministic test RNG so distribution/statistical tests are reproducible.
[fuzz]
runs = 256
seed = "0x4d32"                 # fixed seed: differential + distribution tests must be reproducible

[invariant]
runs = 256
depth = 64
fail_on_revert = false          # handler guards revert on out-of-domain calls by design

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 512, depth = 128 }

# EIP-170. `Moderation` does not fit the 24,576-byte runtime limit on the default
# pipeline (25,986 B; it was 29,769 B before the M2.5 port). Compiled through the
# IR pipeline it is 23,229 B — 1,347 B of headroom — so the DEPLOYED artifact must
# be built with this profile:
#
#     FOUNDRY_PROFILE=viair forge build --sizes
#
# This is not the default because `forge test` cannot run under it: solc correctly
# treats TIMESTAMP as invariant within a transaction and hoists `block.timestamp`
# reads across calls, which makes `vm.warp` invisible to any test that warps
# inside a helper and then reads the clock. That is a cheatcode artifact, not a
# contract defect — but it means the suite silently mis-sequences under via_ir.
#
# Consequence to resolve before M3/deploy: tested bytecode != deployed bytecode.
# Either rework the warp-then-read patterns in the suite so it can run under
# via_ir, or shrink `Moderation` by ~1.5 KB so one pipeline serves both.
[profile.viair]
via_ir = true

# Remappings: forge auto-detects lib/, but pin them explicitly for clarity.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]
