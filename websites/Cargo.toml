[workspace]
members = ["crates/swarm-core", "crates/swarm-browser", "apps/moderator", "apps/publisher", "apps/search", "test/vault-wasm", "apps/checkpoint"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha3 = "=0.10.9"
hex = "=0.4.3"
url = "=2.5.8"
