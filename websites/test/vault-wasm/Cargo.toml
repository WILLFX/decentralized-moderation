[package]
name = "swarm-vault-interop"
version = "0.0.0"
edition.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
swarm-browser = { path = "../../crates/swarm-browser", features = ["interop-tests"] }
swarm-core = { path = "../../crates/swarm-core" }
serde_json.workspace = true
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "=0.4.68"

[features]
browser-check = ["swarm-browser/browser-check"]
